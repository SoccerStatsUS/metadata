[[blurbs]]
kind = "season"
competition = "American Soccer League (1921-1933)"
season = "1928-1929"
text = "The Soccer War broke open in 1928–29 after the ASL ordered its clubs to boycott the National Challenge Cup. Bethlehem Steel, the Newark Skeeters, and the New York Giants entered anyway; the league suspended them, and they joined the rival Eastern Soccer League."

[[blurbs]]
kind = "competition"
competition = "American League of Professional Football"
text = "The ALPF was a side project of six National League baseball owners, who wanted something to fill their ballparks after the 1894 baseball season ended. It lasted seventeen days. Crowds dwindled to a reported 13 for Brooklyn's home game against Philadelphia on October 18, and the league folded before the schedule was finished."

[[blurbs]]
kind = "competition"
competition = "International Soccer League"
text = "Every summer from 1960 to 1965, the International Soccer League brought a dozen club sides from Europe and South America to New York. The clubs were split into two sections that played in turn, the section winners met in a final, and the champion then faced the previous year's winner for the American Challenge Cup."

[[blurbs]]
kind = "competition"
competition = "American Soccer League (1921-1933)"
text = "Beginning in the fall of 1929, the ASL gave up its single September-to-May campaign and played separate fall and spring seasons. The league shrank steadily through the Depression. Its last season, the spring of 1933, was over after seven games, and the name passed to a new semi-pro league that fall."

[[blurbs]]
kind = "season"
competition = "MLS Cup Playoffs"
season = "1996"
text = "The first MLS Cup was played at Foxboro Stadium in the middle of a nor'easter. LA Galaxy led 2–0 with less than twenty minutes left, but D.C. United tied it late and won 3–2 on Eddie Pope's golden-goal header in the fourth minute of extra time."

[[blurbs]]
kind = "season"
competition = "North American Soccer League"
season = "1980"
text = "Giorgio Chinaglia scored seven goals for the Cosmos in an 8–1 playoff win over the Tulsa Roughnecks on August 31, 1980. No one has scored more in a North American professional game."

[[blurbs]]
kind = "season"
competition = "American Soccer League (1921-1933)"
season = "1926-1927"
text = "On January 15, 1927 the New Bedford Whalers beat the Philadelphia Field Club 14–0, the biggest win in the league's history. That same afternoon, a blizzard wiped out Bethlehem Steel's game against the New York Giants."

[[blurbs]]
kind = "player"
player = "Archie Stark"
text = "Archie Stark scored 67 goals in 44 league games for Bethlehem Steel in 1924–25, a single-season mark no American professional league has come near since. He turned down a place on the 1930 World Cup squad to stay home and run his business."

[[blurbs]]
kind = "player"
player = "Bert Patenaude"
text = "Bert Patenaude scored the first hat trick in World Cup history, all three goals in the United States' 3–0 win over Paraguay on July 17, 1930. For decades the record books credited one of them to a teammate; FIFA did not recognize the feat until 2006."

[[blurbs]]
kind = "team"
team = "Bethlehem Steel"
text = "Bethlehem Steel was the steelmaker's company team and the dominant American club of the 1910s and 1920s, with five National Challenge Cup wins between 1915 and 1926 and a 1919 tour of Scandinavia. The company shut the team down in 1930 when the Depression cut into steel orders."

[[blurbs]]
kind = "team"
team = "Los Angeles Wolves"
text = "The Los Angeles Wolves were Wolverhampton Wanderers playing under a local name in the 1967 United Soccer Association. They beat the Washington Whips, who were really Aberdeen, 6–5 in extra time in the final at the Coliseum."

[[blurbs]]
kind = "team"
team = "Baltimore Orioles"
text = "The Orioles' soccer team was the class of the 1894 American League of Professional Football, largely because the club had quietly imported professionals from England. That drew the attention of federal immigration officials, and the league folded before the inquiry went anywhere."

[[blurbs]]
kind = "team"
team = "Hakoah All-Stars"
text = "Hakoah All-Stars formed in the fall of 1929 when New York Hakoah, fresh from winning the National Challenge Cup, merged with Brooklyn Hakoah. Both clubs were built around Vienna Hakoah players who had stayed in America after the club's 1926 tour. The merged team played in the ASL until it dissolved in 1932."

[[blurbs]]
kind = "competition"
competition = "United Soccer Association"
text = "The United Soccer Association had FIFA's blessing but no players of its own. For its only season, the summer of 1967, it imported twelve whole clubs from Europe and South America and had each one play under the name of an American or Canadian city. That winter it merged with the rival National Professional Soccer League to form the NASL."

[[blurbs]]
kind = "competition"
competition = "National Professional Soccer League"
text = "The National Professional Soccer League launched in 1967 without FIFA's sanction but with a CBS television contract, and one referee later admitted stopping play so the network could fit in commercials. Oakland beat Baltimore in a two-game final, and the league merged with the United Soccer Association to form the NASL for 1968."

[[blurbs]]
kind = "team"
team = "Fall River Marksmen"
text = "Sam Mark founded the Marksmen in 1922 and built Mark's Stadium just over the state line in North Tiverton, Rhode Island, so the club could play on Sundays, which Massachusetts blue laws forbade. Fall River won seven of nine ASL titles between 1923 and 1930 before Mark moved the team to New York in 1931."

[[blurbs]]
kind = "team"
team = "Philadelphia Field Club"
text = "The Philadelphia Field Club won the ASL's first title in 1921–22 with Bethlehem Steel's players, who had moved to Philadelphia for the season. When they went back to Bethlehem, the club never recovered: over the next seven seasons it won 39 games and lost 152, and it was on the wrong end of the league's two biggest defeats, 14–0 and 12–1."

[[blurbs]]
kind = "team"
team = "New York Cosmos"
text = "The Cosmos signed Pelé in 1975 and, with Beckenbauer and Chinaglia alongside him, turned an NASL afterthought into the biggest draw in American soccer. A crowd of 77,691 filled Giants Stadium for a playoff game against Fort Lauderdale on August 14, 1977, still the largest in the league's history. The club folded in 1985; a new Cosmos revived the name in 2013."

[[blurbs]]
kind = "player"
player = "Chris Wondolowski"
text = "Chris Wondolowski was a fourth-round supplemental draft pick in 2005 who did not become a regular starter until he was 27. He then led MLS in scoring in 2010 and 2012, and retired in 2021 with 171 regular-season goals, the most in the league's history."

[[blurbs]]
kind = "season"
competition = "Major League Soccer"
season = "1996"
text = "MLS did not allow ties in its first season. A drawn game went to a shootout, with each attacker starting 35 yards out and given five seconds to score, and 34 of the 160 league games were decided that way. The clock counted down and stopped for dead balls, too. Both rules lasted through 1999."

[[blurbs]]
kind = "season"
competition = "FIFA World Cup"
season = "1950"
text = "The 1950 World Cup ended with a final group rather than a knockout, and Brazil needed only a draw in the last game against Uruguay. A crowd recorded at 200,000, the largest in this database, watched Uruguay win 2–1 at the Maracanã. Earlier in the tournament the United States beat England 1–0 in Belo Horizonte."

[[blurbs]]
kind = "season"
competition = "American Soccer League (1921-1933)"
season = "1924-1925"
text = "The ASL grew from eight clubs to twelve in 1924–25 and stretched the schedule to 44 games. Archie Stark scored 67 goals in those 44 for Bethlehem Steel, but Fall River took the title, the second of three in a row."

[[blurbs]]
kind = "competition"
competition = "Eastern Soccer League (1928-1929)"
text = "The United States Football Association set up the Eastern Soccer League in the fall of 1928 as a home for Bethlehem Steel, the Newark Skeeters and the New York Giants, the three clubs the ASL had suspended for entering the National Challenge Cup. Filled out with New York's ethnic clubs, it played a split 1928–29 season and a fall 1929 season before the Soccer War ended and its clubs were folded back into the ASL."

[[blurbs]]
kind = "season"
competition = "North American Soccer League"
season = "1968"
text = "The NASL's first season was the merger of the two 1967 leagues, and it started with seventeen clubs. Twelve of them folded over the winter, and the league played 1969 with five."

[[blurbs]]
kind = "season"
competition = "North American Soccer League"
season = "1984"
text = "The NASL's last season had nine clubs, down from 24 in 1980. Chicago Sting beat Toronto in Soccer Bowl '84, and the league suspended operations the following March and never came back."

[[blurbs]]
kind = "team"
team = "Fort Lauderdale Strikers"
text = "Two lineages have carried the Strikers name. The NASL franchise began as the Washington Darts in 1970, became the Miami Gatos and then the Miami Toros, played in Fort Lauderdale from 1977 to 1983 and finished as the Minnesota Strikers. Miami FC of the revived NASL took the name in 2011. Both are filed here."

[[blurbs]]
kind = "player"
player = "Alan Willey"
text = "Alan Willey scored five goals for the Minnesota Kicks in a 9–2 playoff win over the Cosmos on August 14, 1978. It counted for little: the Cosmos won the second game 4–0, took the tie-breaking mini-game, and went on to the title."

[[blurbs]]
kind = "player"
player = "Bart McGhee"
text = "Bart McGhee scored the United States' first World Cup goal, in the 41st minute against Belgium on July 13, 1930. Seven years earlier, playing for the New York Field Club, he had scored six in one ASL game against the Philadelphia Field Club."

[[blurbs]]
kind = "player"
player = "Landon Donovan"
text = "Landon Donovan retired in 2014 as the leading scorer in the history of both MLS and the United States national team, with six MLS Cup titles between San Jose and the LA Galaxy. He came back for the Galaxy in 2016 and, briefly, for León in Mexico in 2018."

[[blurbs]]
kind = "player"
player = "Giorgio Chinaglia"
text = "Giorgio Chinaglia came to the Cosmos from Lazio in 1976 and led the NASL in scoring five times; nobody in the league's history scored more. In 1984 he bought the club he had played for, and it folded within a year."

[[blurbs]]
kind = "competition"
competition = "Copa Rio"
text = "Copa Rio was a summer tournament staged in Rio de Janeiro and São Paulo from 1951 to 1953, pairing Brazil's biggest clubs with invited European sides. Palmeiras won the first edition and has argued ever since that it was the first club world championship."

[[blurbs]]
kind = "player"
player = "Pelé"
text = "Pelé came out of retirement to join the Cosmos in June 1975 on a three-year contract worth about $4.5 million. He was league MVP in 1976 and won the title in his final season in 1977, and he left the NASL a different league: crowds of a few thousand became tens of thousands wherever the Cosmos played."

[[blurbs]]
kind = "player"
player = "Franz Beckenbauer"
text = "Franz Beckenbauer joined the Cosmos in 1977 as the captain of the reigning world champions and the reigning European Footballer of the Year. He was NASL MVP that first season and won three titles in four years, left for two seasons at Hamburg, then came back for one more year in 1983."

[[blurbs]]
kind = "player"
player = "Kyle Rote Jr."
text = "The son of a New York Giants football star, Kyle Rote Jr. was the NASL's Rookie of the Year and leading scorer in 1973 with the Dallas Tornado. He became far better known for winning ABC's Superstars competition three times, in 1974, 1976 and 1977, beating the best-paid athletes in American sports on national television."

[[blurbs]]
kind = "player"
player = "Walter Bahr"
text = "Walter Bahr captained the United States at the 1950 World Cup and took the shot that Joe Gaetjens turned past England's keeper for the 1–0 win in Belo Horizonte. He played for the national team from 1948 to 1957, then coached at Temple and Penn State. Two of his sons, Chris and Matt, kicked in the NFL."

[[blurbs]]
kind = "player"
player = "Billy Gonsalves"
text = "Billy Gonsalves is often called the best American player of the first half of the twentieth century. He won the National Challenge Cup eight times with six different clubs between 1930 and 1944 and played in the 1930 and 1934 World Cups. The database holds only a slice of that so far: one spring with the Fall River Marksmen and six games for the national team."

[[blurbs]]
kind = "player"
player = "Davey Brown"
text = "Davey Brown was the ASL's leading scorer in 1926–27 with 52 goals for the New York Giants, and played for the United States against Canada in 1925 and 1926. Coverage of the Giants' early seasons is thin here, so his record season is not yet in the database."

[[blurbs]]
kind = "player"
player = "Preki"
text = "Predrag Radosavljević, known as Preki, spent a decade in American indoor soccer with Tacoma and St. Louis before Everton signed him in 1992. He came back for MLS's first season in Kansas City and was league MVP in 1997 and again in 2003, at 40, the oldest player to win it. He was Coach of the Year with Chivas USA in 2007."

[[blurbs]]
kind = "player"
player = "Jimmy Douglas"
text = "Jimmy Douglas was the United States' goalkeeper at the 1924 Olympics and the 1930 World Cup, where he kept clean sheets against Belgium and Paraguay. He hurt a knee early in the semifinal against Argentina and, with no substitutes allowed, played on through a 6–1 defeat."

[[blurbs]]
kind = "player"
player = "Roy Lassiter"
text = "Roy Lassiter scored 27 goals for Tampa Bay in MLS's first season, a record that stood for 22 years until Josef Martinez broke it in 2018."

[[blurbs]]
kind = "player"
player = "Stern John"
text = "Stern John scored 26 goals as a rookie for Columbus in 1998, then 18 more the next year, and left for Nottingham Forest. He never returned to MLS; Trinidad and Tobago's record scorer spent the rest of his career in England."

[[blurbs]]
kind = "player"
player = "Carlos Valderrama"
text = "Carlos Valderrama was the first MLS MVP, in 1996 with the Tampa Bay Mutiny. In 2000 he set up 26 goals, a single-season assist record that has never been matched."

[[blurbs]]
kind = "player"
player = "Marco Etcheverry"
text = "Marco Etcheverry ran D.C. United's midfield from the league's first season through 2003, winning three of the first four MLS Cups and the 1998 MVP award. He arrived from Bolivia with a reputation as a hothead and left as the league's first great playmaker."

[[blurbs]]
kind = "player"
player = "Jaime Moreno"
text = "Jaime Moreno played fourteen seasons in MLS, all but one with D.C. United, and won four MLS Cups. He was the first player in the league with 100 goals and 100 assists, and retired in 2010 as its all-time leading scorer."

[[blurbs]]
kind = "player"
player = "Taylor Twellman"
text = "Taylor Twellman scored 101 goals in 174 league games for New England and was MVP in 2005, but a head injury in 2008 ended his career at 28. He retired formally two years later and became an advocate for concussion awareness in the sport."

[[blurbs]]
kind = "player"
player = "Eddie Pope"
text = "Eddie Pope headed in the golden goal that won the first MLS Cup as a rookie in 1996, and was the league's Defender of the Year the next season. He played in three World Cups for the United States, in 1998, 2002 and 2006."

[[blurbs]]
kind = "player"
player = "Kasey Keller"
text = "Kasey Keller spent nearly two decades in goal for Millwall, Leicester, Tottenham, Rayo Vallecano and Borussia Mönchengladbach before coming home to Seattle for the club's first three MLS seasons. He was the league's Goalkeeper of the Year in 2011, at 41, in the last season of his career."

[[blurbs]]
kind = "player"
player = "Clint Dempsey"
text = "Clint Dempsey was MLS Rookie of the Year with New England in 2004, spent six seasons at Fulham and one at Tottenham, and came back to Seattle in 2013. He finished level with Landon Donovan as the United States' all-time leading scorer, and was Comeback Player of the Year in 2017 after missing half a season with an irregular heartbeat."

[[blurbs]]
kind = "team"
team = "Team America"
text = "Team America was the United States national team entered in the NASL as a franchise, based in Washington, for the 1983 season. Many of the best American players refused to leave their clubs for it, the team finished last, and the experiment was dropped after one year."

[[blurbs]]
kind = "team"
team = "Minnesota Kicks"
text = "The Kicks averaged nearly 33,000 at Metropolitan Stadium in 1977, more than any club in the league but the Cosmos, on the strength of a parking-lot tailgating scene that became the team's real identity. The crowds fell by half within four years and the club folded after the 1981 season."

[[blurbs]]
kind = "team"
team = "Tampa Bay Mutiny"
text = "The Mutiny had the best record in MLS's first season and the league's first MVP in Carlos Valderrama, but never found an owner. The league ran the club itself for six years and shut it down, along with Miami, after 2001."

[[blurbs]]
kind = "team"
team = "Miami Fusion"
text = "The Fusion played at Lockhart Stadium in Fort Lauderdale, the first soccer-specific stadium in MLS. They won the Supporters' Shield in 2001 and were folded four months later, when the league contracted from twelve teams to ten."

[[blurbs]]
kind = "team"
team = "Chivas USA"
text = "Chivas USA was owned by Guadalajara's Chivas and meant to be its American branch, with the same red-and-white stripes and, for a time, an insistence on Mexican and Mexican-American players. It shared the Galaxy's stadium for ten seasons; the league bought the club in 2014, shut it down, and sold a new Los Angeles franchise that became LAFC."

[[blurbs]]
kind = "team"
team = "Atlanta Chiefs"
text = "The Chiefs won the first NASL championship in 1968, and that summer beat Manchester City, the English champions, twice in friendlies. Their coach, Phil Woosnam, became the league's commissioner the next year."

[[blurbs]]
kind = "season"
competition = "Major League Soccer"
season = "2002"
text = "MLS contracted from twelve teams to ten before the 2002 season, folding Miami and Tampa Bay after losing an estimated $250 million in its first six years. It was the low point: the league has added teams in most seasons since."

[[blurbs]]
kind = "season"
competition = "Major League Soccer"
season = "2019"
text = "Carlos Vela scored 34 goals and Zlatan Ibrahimović 30 in 2019, both passing the single-season record Josef Martinez had set a year earlier. Vela's LAFC won the Supporters' Shield with 72 points, another record."

[[blurbs]]
kind = "season"
competition = "FIFA World Cup"
season = "2002"
text = "The United States opened the 2002 World Cup by beating Portugal 3–2, then beat Mexico 2–0 in the round of sixteen and lost 1–0 to Germany in the quarterfinal. It was the team's best finish since 1930."

[[blurbs]]
kind = "competition"
competition = "MLS Reserve League"
text = "MLS ran a reserve league from 2005 to 2008, dropped it to save money, and revived it from 2011 to 2014 before handing reserve play to affiliated USL clubs. Records are patchy; several games from the first run have no known result."

[[blurbs]]
kind = "competition"
competition = "SURUGA Bank Championship"
text = "The SURUGA Bank Championship was a one-game meeting in Japan between the winners of the J.League Cup and the Copa Sudamericana, played each summer from 2008 until 2019. The database covers it through 2013."
